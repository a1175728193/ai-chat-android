name: Build AI Chat APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 取出源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 准备 Android 工具（aapt / d8 / zipalign / apksigner / android.jar）
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME  SDK=$SDK"
          BT="$(ls "$SDK/build-tools" | sort -V | tail -1)"
          PLAT="$(ls "$SDK/platforms" | sort -V | tail -1)"
          echo "build-tools=$BT   platform=$PLAT"
          echo "$SDK/build-tools/$BT" >> "$GITHUB_PATH"
          echo "ANDROID_JAR=$SDK/platforms/$PLAT/android.jar" >> "$GITHUB_ENV"
          export PATH="$SDK/build-tools/$BT:$PATH"
          for t in aapt zipalign apksigner d8; do
            command -v "$t" >/dev/null || { echo "!! 缺少 $t"; exit 1; }
          done
          aapt version && d8 --version

      - name: 取回已有 keystore
        id: kscache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ai-chat-ks
          key: ai-chat-release-keystore-v1

      - name: 生成或复用 keystore
        run: |
          mkdir -p "$RUNNER_TEMP/ai-chat-ks"
          KS="$RUNNER_TEMP/ai-chat-ks/release.jks"
          if [ -f "$KS" ]; then
            echo "复用已有 keystore（签名一致，可直接覆盖安装）"
          else
            echo "首次生成 keystore"
            keytool -genkeypair -v -keystore "$KS" -alias aichat \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass aichatpass123 -keypass aichatpass123 \
              -dname "CN=AI Chat, OU=Self, O=Self, L=NA, ST=NA, C=CN"
          fi

      - name: 编译打包
        env:
          KEYSTORE: ${{ runner.temp }}/ai-chat-ks/release.jks
          KS_PASS: aichatpass123
          KS_ALIAS: aichat
        run: bash scripts/build.sh

      - name: 自检
        run: |
          set -e
          APK=AI-Chat.apk
          echo "════════ 自检报告 ════════"
          apksigner verify "$APK" && echo "  签名有效"
          PKG=$(aapt dump badging "$APK" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -1)
          echo "  包名: $PKG"
          [ "$PKG" = "com.aichat.app" ] || { echo "  !! 包名不符"; exit 1; }
          T=$(mktemp -d); unzip -o -q "$APK" 'classes*.dex' -d "$T"
          MISS=0
          for sym in MainActivity ApiClient "chat/completions" "Authorization" "Bearer " "deepseek-chat" "ai_chat_prefs"; do
            if grep -aq "$sym" "$T"/classes*.dex 2>/dev/null; then
              echo "  dex 含: $sym"
            else
              echo "  !! dex 缺失: $sym"; MISS=1
            fi
          done
          rm -rf "$T"
          [ "$MISS" = "0" ] || exit 1
          unzip -l "$APK" | grep -q 'res/layout/activity_main.xml' || { echo "  !! 缺布局资源"; exit 1; }
          echo "  体积: $(ls -la "$APK" | awk '{printf "%.2f MB", $5/1048576}')"
          echo "════════ 自检通过 ════════"

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-chat-apk
          path: AI-Chat.apk
          if-no-files-found: error
